name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm test:docs
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  browser:
    name: vue browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hina-ui/vue exec playwright install --with-deps chromium
      - run: pnpm test:browser --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.shard }}
          path: packages/vue/src/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

  react-browser:
    name: react browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hina-ui/react exec playwright install --with-deps chromium
      - run: pnpm test:browser:react --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: react-browser-failures-${{ matrix.shard }}
          path: packages/react/src/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

  parity:
    name: parity live (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hina-ui/parity exec playwright install --with-deps chromium
      - run: pnpm --filter @hina-ui/parity test:browser
        env:
          HINA_PARITY_SHARD: ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-failures-${{ matrix.shard }}
          path: packages/parity/test/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

  cross-engine:
    name: cross-engine (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hina-ui/vue exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:browser .layout.browser.test
        env:
          HINA_TEST_BROWSER: ${{ matrix.browser }}
      - run: pnpm test:browser:react .layout.browser.test
        if: success() || failure()
        env:
          HINA_TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cross-engine-failures-${{ matrix.browser }}
          path: |
            packages/vue/src/**/__screenshots__/**
            packages/react/src/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

  docs-vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_APP_BASE_URL: ${{ vars.DOCS_BASE_URL || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/vue/.output/public
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:package
      - run: pnpm test:package:react

  docs-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hina-ui/docs-react lint
      - run: pnpm --filter @hina-ui/docs-react test
      - run: pnpm --filter @hina-ui/docs-react exec opennextjs-cloudflare build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: actions/upload-artifact@v4
        with:
          name: docs-react
          path: docs/react/.open-next
          include-hidden-files: true
          retention-days: 7

  deploy-docs-vue:
    name: deploy docs-vue
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [check, test, browser, react-browser, parity, cross-engine, docs-vue, package, docs-react]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-docs-react:
    name: deploy docs-react
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [check, test, browser, react-browser, parity, cross-engine, docs-vue, package, docs-react]
    runs-on: ubuntu-latest
    environment:
      name: react-docs
      url: https://react.hinaui.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: docs-react
          path: docs/react/.open-next
      - run: pnpm --filter @hina-ui/docs-react exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
