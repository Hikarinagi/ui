name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: &uncovered >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      (github.head_ref != 'dev' && github.head_ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm release:check
      - run: pnpm test:docs
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    if: *uncovered
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  browser:
    name: vue browser (${{ matrix.shard }}/4)
    if: *uncovered
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - run: pnpm test:browser --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.shard }}
          path: packages/vue/src/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

  react-browser:
    name: react browser (${{ matrix.shard }}/4)
    if: *uncovered
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
          package: '@hina-ui/react'
      - run: pnpm test:browser:react --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: react-browser-failures-${{ matrix.shard }}
          path: packages/react/src/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

  parity:
    name: parity live (${{ matrix.shard }}/6)
    if: *uncovered
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
          package: '@hina-ui/parity'
      - run: pnpm --filter @hina-ui/parity test:browser
        env:
          HINA_PARITY_SHARD: ${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-failures-${{ matrix.shard }}
          path: packages/parity/test/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

  cross-engine:
    if: *uncovered
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: firefox webkit
      - run: pnpm test:browser .layout.browser.test
        env:
          HINA_TEST_BROWSER: firefox
      - run: pnpm test:browser:react .layout.browser.test
        if: success() || failure()
        env:
          HINA_TEST_BROWSER: firefox
      - run: pnpm test:browser .layout.browser.test
        if: success() || failure()
        env:
          HINA_TEST_BROWSER: webkit
      - run: pnpm test:browser:react .layout.browser.test
        if: success() || failure()
        env:
          HINA_TEST_BROWSER: webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cross-engine-failures
          path: |
            packages/vue/src/**/__screenshots__/**
            packages/react/src/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

  docs-vue:
    if: *uncovered
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_APP_BASE_URL: ${{ vars.DOCS_BASE_URL || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/vue/.output/public
          retention-days: 7

  package:
    if: *uncovered
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:package
      - run: pnpm test:package:react

  docs-react:
    if: *uncovered
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @hina-ui/docs-react lint
      - run: pnpm --filter @hina-ui/docs-react test
      - name: Build with OpenNext
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @hina-ui/docs-react exec opennextjs-cloudflare build; then exit 0; fi
            echo "::warning::docs-react build attempt $attempt failed"
            sleep 15
          done
          exit 1
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: actions/upload-artifact@v4
        with:
          name: docs-react
          path: docs/react/.open-next
          include-hidden-files: true
          retention-days: 7

  deploy-docs-vue:
    name: deploy docs-vue
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [check, test, browser, react-browser, parity, cross-engine, docs-vue, package, docs-react]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-docs-react:
    name: deploy docs-react
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [check, test, browser, react-browser, parity, cross-engine, docs-vue, package, docs-react]
    runs-on: ubuntu-latest
    environment:
      name: react-docs
      url: https://react.hinaui.dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: docs-react
          path: docs/react/.open-next
      - run: pnpm --filter @hina-ui/docs-react exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
